app-id: com.zorin.Explorer
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  # Must match the runtime's freedesktop base: GNOME 50 is built on 25.08.
  - org.freedesktop.Sdk.Extension.rust-stable
command: zorin-explorer
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=host
  - --talk-name=org.freedesktop.FileManager1
  # GVfs. Without these the sandbox cannot reach the gvfs daemons at all, and
  # every non-local location fails with "Operation not supported" -- which is
  # not an empty network but no access to ask. That silently emptied Browse
  # Network and Online accounts, and disabled remote browsing generally, while
  # the same URIs enumerated fine outside the sandbox.
  #
  # Both paths are needed and are not the same thing: gvfsd is the daemon's
  # peer-to-peer socket, and without it gvfs falls back to the session bus and
  # says so on every call; gvfs is the FUSE mount point remote files are read
  # through.
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
  - --filesystem=xdg-run/gvfs
modules:
  - name: zorin-explorer
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/zorin-explorer /app/bin/zorin-explorer
      - install -Dm644 resources/com.zorin.Explorer.desktop /app/share/applications/com.zorin.Explorer.desktop
      - install -Dm644 resources/icons/hicolor/scalable/apps/com.zorin.Explorer.svg /app/share/icons/hicolor/scalable/apps/com.zorin.Explorer.svg
      - install -Dm644 packaging/com.zorin.Explorer.metainfo.xml /app/share/metainfo/com.zorin.Explorer.metainfo.xml
    sources:
      - type: dir
        path: ../..
        # Directory sources are copied wholesale into the build sandbox, so the
        # local build trees have to be excluded or every build copies gigabytes
        # of cargo and flatpak-builder output into itself.
        skip:
          - target
          - build
          - dist
          - .flatpak-builder
          - .git
          - .worktrees
