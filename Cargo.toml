[package]
name = "zorin-explorer"
version = "0.3.0"
edition = "2021"
description = "A native Explorer-style file manager for Linux"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.6", features = ["v1_5"] }
gio = "0.19"
glib = "0.19"
gtk = { package = "gtk4", version = "0.8", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
futures-util = "0.3"
# Keep the proc-macro dependency compatible with the Rust 1.75 toolchain.
proc-macro-crate = "=3.1.0"
indexmap = "=2.7.1"

[dev-dependencies]
tempfile = "=3.10.1"

[[bin]]
name = "zorin-explorer"
path = "src/main.rs"
