name: Flatpak

# A release Flatpak bundle for every commit that lands on main, plus a manual
# trigger for testing the pipeline itself.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bundle:
    # Docker mode, not host mode. A `:host` label on this runner would run the
    # job inside the act_runner container itself, which is a bare Alpine image
    # with no flatpak, flatpak-builder, bwrap, cargo or node.
    runs-on: ubuntu-latest
    container:
      # Preinstalls the GNOME runtime and SDK, so the install step below is
      # close to a no-op. Keep this tag in step with `runtime-version` in
      # packaging/flatpak/com.zorin.Explorer.yml.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # flatpak-builder sandboxes every module with bubblewrap, which has to
      # create a user namespace and mount a fresh procfs inside it. All three
      # options are required and were each shown to be necessary; dropping any
      # one reproduces a failure:
      #
      #   (none)                   bwrap: No permissions to create a new namespace
      #   without systempaths      bwrap: Can't mount proc on /newroot/proc
      #
      # `systempaths=unconfined` is the one that matters least obviously: Docker
      # masks parts of /proc, and the kernel refuses to mount a fresh procfs in
      # a nested namespace when that would unmask them. CAP_SYS_ADMIN is *not*
      # needed once seccomp is unconfined.
      #
      # act_runner honours --security-opt (it refuses only --privileged), so
      # this needs nothing in its config.yaml. The host does still need
      # kernel.apparmor_restrict_unprivileged_userns=0; the environment report
      # below prints that, the effective capabilities and the seccomp mode, so a
      # failing run says which one is missing.
      options: >-
        --security-opt systempaths=unconfined
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
      - name: Report the build environment
        # A shell step needs no node, so this runs before the JS actions and
        # says what the job actually executes in. Keep it first: when a run
        # fails in checkout, this is the only output that explains why.
        run: |
          echo "user:        $(id -un) (uid $(id -u))"
          echo "host:        $(uname -srm)  $(. /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-unknown}")"
          echo "PATH:        $PATH"
          echo "containerised: $( [ -f /.dockerenv ] && echo 'yes (/.dockerenv present)' || echo 'no /.dockerenv' )"
          [ -r /proc/1/cgroup ] && echo "pid1 cgroup: $(head -1 /proc/1/cgroup)" || true
          for tool in node nodejs flatpak flatpak-builder bwrap git cargo; do
            printf '%-16s %s\n' "$tool:" "$(command -v "$tool" || echo MISSING)"
          done
          echo "node version: $(node --version 2>&1 || true)"
          echo "unprivileged userns:"
          for knob in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns; do
            echo "  $knob = $(sysctl -n "$knob" 2>/dev/null || echo 'not present')"
          done
          echo "effective caps:    $(grep -E '^CapEff' /proc/self/status | awk '{print $2}')"
          echo "  SYS_ADMIN held:  $( capsh --decode="0x$(grep -E '^CapEff' /proc/self/status | awk '{print $2}')" 2>/dev/null | grep -q sys_admin && echo yes || echo 'no (or capsh missing)' )"
          echo "seccomp mode:      $(grep -E '^Seccomp:' /proc/self/status | awk '{print $2}') (0=disabled 2=filtered)"
          echo "apparmor profile:  $(cat /proc/self/attr/current 2>/dev/null || echo unavailable)"
          echo "disk free on /:    $(df -h / | awk 'NR==2 {print $4}')"
          echo "disk free on /tmp: $(df -h /tmp | awk 'NR==2 {print $4}')"
          echo "home: ${HOME:-unset}"

      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install the Rust SDK extension
        # The image already carries the runtime and SDK in the system
        # installation, so only the Rust extension is missing. Installing into
        # --user instead would re-download both (ten minutes); asking to update
        # the preinstalled ones fails with `Invalid cross-device link`, because
        # ostree cannot hardlink across the image's layers. So: assert what the
        # image is expected to provide, then add only what it lacks.
        #
        # The extension version tracks the runtime's freedesktop base rather
        # than its GNOME version, so it moves with `runtime-version` in the
        # manifest: GNOME 50 is built on 25.08.
        run: |
          flatpak remote-add --if-not-exists --system \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak info org.gnome.Platform//50 > /dev/null
          flatpak info org.gnome.Sdk//50 > /dev/null
          flatpak install --system --noninteractive --or-update flathub \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Read the crate version
        id: crate
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ZorinExplorer ${version}"

      - name: Build the Flatpak
        # State and build trees live outside the checkout, under a run-scoped
        # directory: the manifest's source is the checkout itself, so anything
        # written inside it would be copied into the next build, and concurrent
        # runs on one host must not share a build tree.
        #
        # --disable-rofiles-fuse because /dev/fuse is not dependably available;
        # it only costs a slower copy of the build tree.
        run: |
          flatpak-builder \
            --force-clean \
            --disable-rofiles-fuse \
            --state-dir="/tmp/flatpak-ci-${{ github.run_id }}/state" \
            --repo="/tmp/flatpak-ci-${{ github.run_id }}/repo" \
            "/tmp/flatpak-ci-${{ github.run_id }}/build" \
            packaging/flatpak/com.zorin.Explorer.yml

      - name: Export a single-file bundle
        run: |
          flatpak build-bundle \
            "/tmp/flatpak-ci-${{ github.run_id }}/repo" \
            "ZorinExplorer-${{ steps.crate.outputs.version }}.flatpak" \
            com.zorin.Explorer master
          ls -l ZorinExplorer-*.flatpak

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZorinExplorer-${{ steps.crate.outputs.version }}-flatpak
          path: ZorinExplorer-*.flatpak
          if-no-files-found: error
          retention-days: 30

      - name: Remove the build trees
        # The host is not disposable, so this runs even when the build failed.
        if: always()
        run: rm -rf "/tmp/flatpak-ci-${{ github.run_id }}"
