name: Debian package

# A .deb for every commit that lands on main, and for every `v*` tag, which
# also attaches it to the release. This is the shipping package: the app needs
# the host's applications, GVfs, terminal and polkit, none of which a sandboxed
# package format provides.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# A release commit arrives twice: once as a push to main and once as a tag.
# Both would build the same commit, so a tag run cancels the branch run in its
# group. Branch runs never cancel, so a tag that happens to start first still
# publishes instead of being cancelled by the branch event.
concurrency:
  group: deb-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  deb:
    # The `flatpak` label names the one runner here known to take container
    # jobs. The job itself needs nothing privileged; the image is what matters.
    runs-on: flatpak
    container:
      # Ubuntu 24.04 is the baseline (Zorin OS 18). The Depends line is computed
      # from the libraries the binary links, so building on the oldest supported
      # release gives a package that installs on it and on anything newer. The
      # image carries node, which the JS actions below need.
      image: catthehacker/ubuntu:act-24.04
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install the build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev binutils curl jq ca-certificates \
            libgtk-4-dev libadwaita-1-dev libarchive-dev

      - name: Install Rust
        # Cargo.lock is format 4, which Ubuntu's packaged cargo 1.75 cannot read.
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Read the crate version
        id: crate
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building zorin-explorer ${version}"

      - name: Build the package
        run: packaging/deb/build-deb.sh dist

      - name: Describe the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload the package
        # v3, not v4: Gitea presents itself as GitHub Enterprise, which
        # upload-artifact@v4 refuses client-side.
        uses: actions/upload-artifact@v3
        with:
          name: zorin-explorer-${{ steps.crate.outputs.version }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.crate.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          package="$(ls dist/zorin-explorer_*.deb)"
          asset="$(basename "$package")"

          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "tag ${TAG} does not match version ${VERSION} in Cargo.toml" >&2
            exit 1
          fi

          api() {
            local method="$1" path="$2"; shift 2
            local body status
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' -X "$method" \
              -H "Authorization: token ${GITEA_TOKEN}" "${API}${path}" "$@")"
            if [[ "$status" != 2* ]]; then
              echo "${method} ${path} failed (HTTP ${status}):" >&2
              cat "$body" >&2
              return 1
            fi
            cat "$body"
          }

          # Re-running a tag attaches to the release that already exists rather
          # than failing on the duplicate; create it only when none is present.
          if release="$(api GET "/releases/tags/${TAG}" 2>/dev/null)"; then
            echo "release ${TAG} exists; attaching to it"
          elif release="$(api POST /releases -H 'Content-Type: application/json' \
              --data "$(jq -n \
                --arg tag "$TAG" \
                --arg name "Zorin Explorer ${VERSION}" \
                --arg body "Release ${TAG}, built from ${COMMIT}." \
                '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')" 2>/dev/null)"; then
            echo "created release ${TAG}"
          else
            sleep 3
            release="$(api GET "/releases/tags/${TAG}")"
            echo "release ${TAG} was created concurrently; attaching to it"
          fi
          id="$(jq -r '.id' <<< "$release")"

          existing="$(jq -r --arg n "$asset" '.assets[]? | select(.name == $n) | .id' <<< "$release")"
          if [[ -n "$existing" ]]; then
            echo "replacing existing asset ${existing}"
            api DELETE "/releases/${id}/assets/${existing}" > /dev/null
          fi

          api POST "/releases/${id}/assets?name=${asset}" -F "attachment=@${package}" > /dev/null
          echo "attached ${asset} ($(stat -c%s "$package") bytes) to release ${TAG}"
