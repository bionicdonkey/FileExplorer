name: macOS

# Builds and tests the macOS app on GitHub's own runners, twice: on Apple silicon (arm64) and on
# Intel (x86_64). The app is one universal binary, so each runner compiles both halves and runs the
# half it can, which means CI now executes both architectures.
#
# Unverified until it has run: the runner labels (`macos-15`, `macos-15-intel`), that the default
# Xcode on them is 16 or newer, and that the window-driving tests work on a hosted runner.
on:
  push:
    # `tags` alone would stop branch pushes from triggering the workflow, so branches are listed too.
    branches:
      - '**'
    paths:
      - 'macos/**'
      - 'spec/**'
      - 'scripts/check-separation.sh'
      - '.github/workflows/macos.yml'
    tags:
      - 'macos-v*'
  pull_request:
    paths:
      - 'macos/**'
      - 'spec/**'
      - 'scripts/check-separation.sh'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Host
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: The two apps stay separate
        run: sh scripts/check-separation.sh

      - name: Swift packages
        # The domain, adapters and scenario runner build and test without Xcode.
        run: |
          set -eu
          cd macos
          export SPEC_ROOT="$GITHUB_WORKSPACE/spec"
          for package in ExplorerDomain ExplorerAdapters ExplorerSpecRunner; do
            echo "== $package"
            (cd "Packages/$package" && swift test)
          done

      - name: Behaviour scenarios and parity status
        run: |
          set -eu
          cd macos/Packages/ExplorerSpecRunner
          SPEC_ROOT="$GITHUB_WORKSPACE/spec" swift run spec-runner

      - name: Universal app build and unit tests
        # Builds arm64 + x86_64, checks both are present in the app and the helper, then runs the
        # unit tests for this runner's architecture.
        run: |
          set -eu
          cd macos
          sh scripts/xcode-test.sh

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs-${{ matrix.arch }}
          path: macos/.dd/logs
          if-no-files-found: ignore
          retention-days: 7

  release:
    # Only for a `macos-vX.Y.Z` tag, and only after both runners passed. Builds the universal app,
    # signs it with the Developer ID, notarizes, staples and attaches the .dmg to a draft release.
    #
    # Repository secrets this job reads (none is written to the repository or the log):
    #   MACOS_SIGNING_CERT_P12_BASE64   the Developer ID Application certificate and key, base64 .p12
    #   MACOS_SIGNING_CERT_PASSWORD     the .p12 password
    #   MACOS_SIGNING_IDENTITY          "Developer ID Application: Name (TEAMID)"
    #   MACOS_TEAM_ID                   the team identifier
    #   MACOS_NOTARY_KEY_P8_BASE64      the App Store Connect API key (.p8), base64
    #   MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER
    #
    # Unverified: this job needs those secrets, so it has not run. `scripts/release.sh` itself was
    # run without them and produces the universal, ad-hoc-signed .dmg.
    needs: macos
    if: startsWith(github.ref, 'refs/tags/macos-v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Sign, notarize and package
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MORIN_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MORIN_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MORIN_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MORIN_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          [ -n "$CERT_P12" ] && [ -n "$MORIN_SIGNING_IDENTITY" ] || { echo "the signing secrets are not set"; exit 1; }
          cd macos
          work="$(mktemp -d)"
          keychain="$work/release.keychain-db"
          password="$(uuidgen)"
          cleanup() { security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$work"; }
          trap cleanup EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT_P12" | base64 -D > "$work/cert.p12"
          security import "$work/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046  # the existing keychain list must split into separate arguments
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8" | base64 -D > "$work/notary.p8"
          export MORIN_NOTARY_KEY_PATH="$work/notary.p8"
          sh scripts/release.sh --version "${TAG#macos-v}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/release/Morin-Explorer-*.dmg build/release/Morin-Explorer-*.dmg.sha256 "$GITHUB_WORKSPACE/dist/"

      - name: Attach the .dmg to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/Morin-Explorer-* --clobber
          else
            gh release create "$TAG" dist/Morin-Explorer-* --draft --title "Morin Explorer ${TAG#macos-v}" \
              --notes "Release ${TAG}, built from ${GITHUB_SHA}."
          fi
          echo "The .dmg is attached to the ${TAG} release; publish it from the Releases page."
